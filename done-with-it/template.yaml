AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Done With It - second-hand marketplace. S3 (site + photos), API Gateway + Lambda, DynamoDB.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 256
    Handler: index.handler
    Environment:
      Variables:
        TABLE_NAME: !Ref ListingsTable
        BUCKET: !Ref WebsiteBucket

Resources:
  # ---- TIER 1: PRESENTATION (website + item photos) ----
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration: {IndexDocument: index.html}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'

  # ---- TIER 3: DATA ----
  ListingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: id, AttributeType: S}
      KeySchema:
        - {AttributeName: id, KeyType: HASH}

  # ---- TIER 2: LOGIC (one folder per function) ----
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [Content-Type]

  CreateListingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/createListing/
      Policies:
        - DynamoDBWritePolicy: {TableName: !Ref ListingsTable}
        - S3WritePolicy: {BucketName: !Ref WebsiteBucket}
      Events:
        Api:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /listings, Method: POST}

  ListListingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/listListings/
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref ListingsTable}
      Events:
        Api:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /listings, Method: GET}

  UpdateListingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/updateListing/
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref ListingsTable}
      Events:
        Api:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/listings/{id}', Method: PUT}

  DeleteListingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/deleteListing/
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref ListingsTable}
        - S3CrudPolicy: {BucketName: !Ref WebsiteBucket}
      Events:
        Api:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/listings/{id}', Method: DELETE}

Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  WebsiteBucketName:
    Value: !Ref WebsiteBucket
  WebsiteUrl:
    Value: !GetAtt WebsiteBucket.WebsiteURL
